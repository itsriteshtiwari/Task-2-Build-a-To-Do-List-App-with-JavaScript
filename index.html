<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Theme To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My to-do list</h1>
            <p class="current-date" id="currentDate"></p>
        </header>
        
        <section class="stats">
            <div class="stat-card">
                <span class="stat-title">Total</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Done</span>
                <span class="stat-value" id="doneCount">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-title">Remaining</span>
                <span class="stat-value" id="remainingCount">0</span>
            </div>
        </section>

        <section class="input-section">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <select id="priorityInput">
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
            <button id="addBtn">+ Add</button>
        </section>

        <nav class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Done</button>
            <button class="filter-btn" data-filter="high priority">High priority</button>
        </nav>

        <ul class="task-list" id="taskList">
            </ul>

        <button class="clear-btn" id="clearCompletedBtn">Clear completed</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
